[workspace]
authors = ["issanym <jacinthenym@proton.me>"]
channels = ["robostack-humble", "conda-forge"]
name = "bullseye"
platforms = ["linux-64","win-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build = "colcon build"
camera-follow = "ros2 run follower bullseye --ros-args -p camera_index:=0 -p show_debug_window:=true" # camera index to 0 for webcam
lidar-start = "ros2 launch sllidar_ros2 sllidar_c1_launch.py"
obstacle = "ros2 run lidarTest lidarTest --ros-args -r cmd_vel:=lidar_vel"
tsim = "ros2 run turtlesim turtlesim_node"
controller="ros2 run controller controller --ros-args -r cmd_vel:=joy_vel"
mux="ros2 run twist_mux twist_mux --ros-args --params-file ~/Projects/robotAIWeeek-issa/src/external/twist_mux/config/twist_mux_topics.yaml"

[activation]
scripts = [
    "install/setup.sh", 
    "install/setup.bat", 
    #"src/sllidar_ros2/scripts/create_udev_rules.sh"
    ]
#[activstion.env]

[target.unix.activation.env] # linux only parameters
QT_QPA_PLATFORM="xcb"
GDK_BACKEND="x11"
LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
opencv = ">=4.13.0,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
numpy = ">=2.5.1,<3"
ros-humble-urdf-tutorial = ">=1.1.0,<2"
ros-humble-turtlesim = ">=1.4.3,<2"
pygame = ">=2.6.1,<3"
ros-humble-twist-mux = ">=4.3.0,<5"
